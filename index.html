<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>私室選｜嚴選獨立工作室指南</title>
  <style>
    :root {
      --linen: #F6F2EA;
      --ivory: #FFFEFA;
      --sand: #EFEAE0;
      --sage: #E6EDE3;
      --peach: #F3E6D8;
      --olive: #EAECE4;
      --ink: #282623;
      --muted: #787166;
      --forest: #224937;
      --hairline: #E6DFD3;
      --gold: #C89E4C;
      --bronze: #9A5B2C;
      --danger: #B91C1C;

      /* 全站閱讀縮放倍率 + 各區塊獨立字體大小 */
      --font-scale: 1;
      --fs-brand: 20px;
      --fs-hero: 28px;
      --fs-hero-badge: 12px;
      --fs-heading: 20px;
      --fs-body: 14px;
      --fs-pill: 12px;
      --fs-sub: 12px;
      --fs-help-card-title: 16px;
      --fs-help-item-title: 15px;
      --fs-help-item-desc: 13px;
      --fs-principle: 13px;
      --fs-quote: 16px;
      --fs-card-title: 15px;
      --fs-card-meta: 12px;
      --fs-btn: 13px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--linen);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: calc(var(--fs-body) * var(--font-scale));
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 76px;
    }
    @media (min-width: 768px) { body { padding-bottom: 32px; } }

    a, button, input, select, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }

    /* 頂部導覽列 */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(246, 242, 234, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hairline);
    }
    .topbar-inner {
      max-width: 980px; margin: 0 auto; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-align: left; }
    .brand-logo {
      width: 40px; height: 40px; border-radius: 13px;
      background: var(--forest); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 4px 10px rgba(34, 73, 55, 0.18);
    }
    .brand-title {
      font-size: calc(var(--fs-brand) * var(--font-scale));
      font-weight: 700; letter-spacing: 0.1em; line-height: 1.15;
    }
    .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    @media (max-width: 480px) { .brand-sub { display: none; } }

    .nav-links { display: none; gap: 20px; align-items: center; }
    @media (min-width: 768px) { .nav-links { display: flex; } }
    .nav-btn { font-size: 14px; font-weight: 500; color: var(--muted); padding: 6px 2px; }
    .nav-btn.active { color: var(--forest); font-weight: 700; border-bottom: 2px solid var(--forest); }

    .top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .font-select {
      padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--ivory); border: 1px solid var(--hairline); color: var(--ink);
      cursor: pointer; outline: none;
    }
    .font-select:focus { border-color: var(--forest); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 8px 15px; border-radius: 999px;
      font-size: calc(var(--fs-btn) * var(--font-scale));
      font-weight: 600; transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-forest { background: var(--forest); color: #fff; }
    .btn-sage { background: var(--sage); color: var(--forest); }
    .btn-ivory { background: var(--ivory); color: var(--ink); border: 1px solid var(--hairline); }
    .btn-danger { background: #FEE2E2; color: var(--danger); }
    .btn-sm { padding: 6px 11px; font-size: 12px; }

    /* 手機底部導覽 */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: rgba(255, 254, 250, 0.96); backdrop-filter: blur(8px);
      border-top: 1px solid var(--hairline);
      display: grid; grid-template-columns: repeat(4, 1fr); height: 62px;
    }
    @media (min-width: 768px) { .bottom-nav { display: none; } }
    .bottom-nav button {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 12px; color: var(--muted);
    }
    .bottom-nav button.active { color: var(--forest); font-weight: 700; }

    /* 版面容器 */
    .container { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
    .stack > * + * { margin-top: 20px; }

    /* 各區塊文字類別 */
    .section-heading {
      font-size: calc(var(--fs-heading) * var(--font-scale));
      font-weight: 700; line-height: 1.35;
    }
    .body-text {
      font-size: calc(var(--fs-body) * var(--font-scale));
      line-height: 1.65;
    }
    .sub-text {
      font-size: calc(var(--fs-sub) * var(--font-scale));
      line-height: 1.6;
    }
    .help-card-title-text {
      font-size: calc(var(--fs-help-card-title) * var(--font-scale));
      font-weight: 700; line-height: 1.4;
    }
    .help-item-title-text {
      font-size: calc(var(--fs-help-item-title) * var(--font-scale));
      font-weight: 700; line-height: 1.4;
    }
    .help-item-desc-text {
      font-size: calc(var(--fs-help-item-desc) * var(--font-scale));
      line-height: 1.6;
    }
    .principle-text {
      font-size: calc(var(--fs-principle) * var(--font-scale));
      line-height: 1.6;
    }
    .quote-text {
      font-size: calc(var(--fs-quote) * var(--font-scale));
      font-weight: 700; line-height: 1.5;
    }

    /* 卡片與通用元件 */
    .card {
      background: var(--ivory); border: 1px solid var(--hairline);
      border-radius: 20px; padding: 20px;
      box-shadow: 0 2px 10px rgba(40, 38, 35, 0.03);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px;
      font-size: calc(var(--fs-pill) * var(--font-scale)); font-weight: 600;
    }
    .pill-sage { background: var(--sage); color: var(--forest); }
    .pill-peach { background: var(--peach); color: var(--bronze); }

    .admin-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--sage); color: var(--forest);
    }

    /* 服務項目與平台優惠排版 */
    .service-head-bar {
      display: flex; align-items: center; justify-content: flex-start;
      flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
    }
    .service-action-hint {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 11px; border-radius: 999px;
      background: var(--sage); color: var(--forest);
      border: 1px solid rgba(34, 73, 55, 0.22);
      font-size: calc(var(--fs-sub) * var(--font-scale));
      font-weight: 700; line-height: 1.4;
    }
    .service-promo-banner {
      background: #FAF0E2; border: 1px solid #EAD3B3;
      color: #854B1E; border-radius: 12px;
      padding: 9px 12px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
      font-size: calc(var(--fs-sub) * var(--font-scale));
      font-weight: 600; line-height: 1.45;
    }
    .service-item-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 8px; border-bottom: 1px solid var(--hairline);
      cursor: pointer; transition: background 0.15s; border-radius: 10px;
    }
    .service-item-row:last-child { border-bottom: none; }
    .service-item-row:hover { background: #F7F2E8; }
    .service-price-col {
      text-align: right; flex-shrink: 0;
    }
    .price-orig {
      display: block;
      font-size: calc(11px * var(--font-scale));
      color: #9A9286; text-decoration: line-through; line-height: 1.2;
    }
    .price-deal-row {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    .promo-tag {
      background: var(--peach); color: var(--bronze);
      border: 1px solid #E5C7A6;
      font-size: calc(10px * var(--font-scale));
      font-weight: 700; padding: 1px 6px; border-radius: 6px; line-height: 1.3;
    }
    .price-deal {
      font-size: calc(var(--fs-body) * var(--font-scale));
      font-weight: 700; color: var(--bronze);
    }
    .price-regular {
      font-size: calc(var(--fs-body) * var(--font-scale));
      font-weight: 700; color: var(--forest);
    }

    /* 首頁主視覺拼貼 */
    .hero {
      position: relative; border-radius: 22px; overflow: hidden;
      min-height: 240px; border: 1px solid var(--hairline); background: var(--sand);
    }
    @media (min-width: 768px) { .hero { min-height: 290px; } }
    .hero-grid {
      position: absolute; inset: 0; display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px; height: 100%;
    }
    .hero-right {
      display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2px; height: 100%; min-height: 0;
    }
    .hero img { width: 100%; height: 100%; min-height: 0; object-fit: cover; }
    .hero-overlay {
      position: relative; z-index: 2; min-height: 240px;
      background: rgba(35, 32, 28, 0.38);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px 16px; color: #fff;
    }
    @media (min-width: 768px) { .hero-overlay { min-height: 290px; } }
    .hero-overlay h1 {
      font-size: calc(var(--fs-hero) * var(--font-scale));
      font-weight: 700; line-height: 1.4; text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    }
    .hero-badge {
      margin-top: 10px; padding: 5px 14px; border-radius: 999px;
      background: rgba(40, 38, 35, 0.7);
      font-size: calc(var(--fs-hero-badge) * var(--font-scale));
    }

    /* 幫助客戶 & 幫助工作室對照區 */
    .help-toggle-bar {
      display: inline-flex; background: var(--sand); padding: 4px; border-radius: 999px;
      border: 1px solid var(--hairline); margin-top: 10px;
    }
    @media (min-width: 768px) { .help-toggle-bar { display: none; } }
    .help-toggle-btn {
      padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .help-toggle-btn.active { background: var(--forest); color: #fff; }
    @media (max-width: 767px) { .help-mobile-hidden { display: none; } }

    .help-card {
      background: var(--ivory); border: 1px solid var(--hairline);
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 2px 10px rgba(40, 38, 35, 0.03);
      display: flex; flex-direction: column;
    }
    .help-card-head {
      background: #F4EEE3; padding: 16px 20px; border-bottom: 1px solid var(--hairline);
    }
    .help-card-title {
      display: flex; align-items: center; gap: 8px;
      color: var(--forest); margin-bottom: 4px;
    }
    .help-dot {
      width: 6px; height: 18px; border-radius: 999px; background: var(--forest); display: inline-block; flex-shrink: 0;
    }
    .help-item {
      padding: 14px 20px; border-bottom: 1px solid #EFE9DF;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .help-item:last-child { border-bottom: none; }
    .help-num {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--sage); color: var(--forest);
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; margin-top: 2px;
    }

    /* 網格 */
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 768px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }

    .studio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 768px) { .studio-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }

    /* 工作室卡片 */
    .studio-card {
      background: var(--ivory); border: 1px solid var(--hairline);
      border-radius: 18px; overflow: hidden; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .studio-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(40,38,35,0.06); }
    .studio-thumb { position: relative; aspect-ratio: 4 / 3; background: var(--sand); overflow: hidden; }
    .studio-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .studio-cert-tag {
      position: absolute; top: 8px; left: 8px;
      background: rgba(255, 254, 250, 0.92); color: var(--forest);
      padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .studio-body { padding: 12px; }
    .studio-name {
      font-size: calc(var(--fs-card-title) * var(--font-scale));
      font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .studio-meta {
      display: flex; justify-content: space-between; align-items: center; margin-top: 4px;
      font-size: calc(var(--fs-card-meta) * var(--font-scale)); gap: 6px;
    }
    .studio-loc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .studio-price { color: var(--forest); font-weight: 700; flex-shrink: 0; }

    /* 表單與篩選 */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .input, .select, .textarea {
      width: 100%; padding: 9px 12px; border-radius: 12px;
      border: 1px solid var(--hairline); background: var(--linen);
      font-size: 14px; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--forest); background: var(--ivory); }
    .filter-bar .select, .filter-bar .input { width: auto; border-radius: 999px; background: var(--ivory); padding: 7px 14px; font-size: 13px; }
    .label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }

    /* 彈窗 Modal */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(40, 38, 35, 0.5); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: var(--linen); width: 100%; max-width: 680px; max-height: 90vh;
      border-radius: 24px; border: 1px solid var(--hairline);
      overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    .modal-box-sm { max-width: 380px; }
    .modal-head {
      position: sticky; top: 0; background: var(--linen);
      padding: 14px 18px; border-bottom: 1px solid var(--hairline);
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap; z-index: 2;
    }
    .modal-head-actions {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .modal-body { padding: 18px; }

    /* 後台管理專屬樣式 */
    .admin-banner {
      background: var(--forest); color: #fff;
      padding: 14px 18px; border-radius: 18px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    }
    .admin-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .admin-tab-btn {
      padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: var(--ivory); border: 1px solid var(--hairline); color: var(--muted);
    }
    .admin-tab-btn.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .admin-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px; border-bottom: 1px solid var(--hairline);
    }
    .admin-row:last-child { border-bottom: none; }
    .service-edit-row {
      display: grid; grid-template-columns: 2fr 1fr 2fr auto; gap: 8px; align-items: center;
      background: var(--linen); padding: 10px; border-radius: 12px; border: 1px solid var(--hairline);
      margin-bottom: 8px;
    }
    @media (max-width: 640px) { .service-edit-row { grid-template-columns: 1fr; } }

    /* 字體設定列（左調右看） */
    .fs-control-card {
      background: var(--linen); border: 1px solid var(--hairline);
      border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .fs-control-top {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    }
    .fs-slider-row {
      display: flex; align-items: center; gap: 10px;
    }
    .fs-range {
      flex: 1; accent-color: var(--forest); cursor: pointer; height: 6px;
    }
    .fs-step-btn {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--ivory); border: 1px solid var(--hairline);
      font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
    }
    .fs-step-btn:hover { border-color: var(--forest); color: var(--forest); }
    .fs-tag-badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 700;
      background: var(--forest); color: #fff; margin-right: 4px;
    }
    .preview-pane-label {
      font-size: 11px; font-weight: 700; color: var(--forest);
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }

    .error-text { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 6px; }
    .toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: var(--forest); color: #fff; padding: 9px 18px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      z-index: 99; box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" data-action="go-tab" data-tab="home">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
            <rect x="2.5" y="2.5" width="35" height="35" rx="10" stroke="#D8B671" stroke-opacity="0.6" stroke-width="1.2"/>
            <path d="M11 31.5V18C11 13.03 15.03 9 20 9C24.97 9 29 13.03 29 18V31.5" stroke="#FAF7F0" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M8.5 31.5H31.5" stroke="#FAF7F0" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 11.8L20.9 14.3L23.4 15.2L20.9 16.1L20 18.6L19.1 16.1L16.6 15.2L19.1 14.3L20 11.8Z" fill="#E6C374"/>
          </svg>
        </div>
        <div>
          <div class="brand-title" id="hdr-brand-name">私室選</div>
          <div class="brand-sub" id="hdr-brand-sub">嚴選獨立工作室指南</div>
        </div>
      </button>

      <nav class="nav-links" id="desktop-nav">
        <button class="nav-btn active" data-action="go-tab" data-tab="home">首頁</button>
        <button class="nav-btn" data-action="go-tab" data-tab="explore">探索</button>
        <button class="nav-btn" data-action="go-tab" data-tab="saved">收藏</button>
        <button class="nav-btn" data-action="go-tab" data-tab="profile">申請進駐</button>
      </nav>

      <div class="top-actions">
        <select class="font-select" id="font-size-select" data-font-scale-select title="調整整體閱讀字體大小" aria-label="調整字體大小">
          <option value="0.9">字體：較小</option>
          <option value="1" selected>字體：標準</option>
          <option value="1.15">字體：偏大</option>
          <option value="1.3">字體：特大</option>
        </select>
        <button class="btn btn-sage btn-sm" data-action="open-cert">優質認證</button>
        <button class="btn btn-forest btn-sm hidden" id="toggle-mode-btn" data-action="toggle-admin">回到前台</button>
      </div>
    </div>
  </header>

  <!-- 主畫面內容容器 -->
  <main class="container stack" id="main-content">
    <div class="card" style="text-align:center; padding:32px;">
      <p style="font-weight:700;">正在載入「私室選」畫面...</p>
      <p id="boot-error-msg" style="font-size:13px; color:#787166; margin-top:8px;">若未出現畫面，請確認程式碼複製完整且編碼為 UTF-8。</p>
    </div>
  </main>

  <!-- 手機底部導覽列 -->
  <nav class="bottom-nav" id="mobile-nav">
    <button class="active" data-action="go-tab" data-tab="home"><span>首頁</span></button>
    <button data-action="go-tab" data-tab="explore"><span>探索</span></button>
    <button data-action="go-tab" data-tab="saved"><span>收藏</span></button>

      function setSessionAuth(flag) {
        isAdminAuthed = flag;

          if (flag) sessionStorage.setItem(SESSION_AUTH_KEY, '1');
          else sessionStorage.removeItem(SESSION_AUTH_KEY);
        } catch (e) {}

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            const ps = parsed.site || {};
            return {
              adminPassword: parsed.adminPassword || DEFAULT_DATA.adminPassword,
              fontScale: Number(parsed.fontScale) || 1,
              fontSizes: { ...DEFAULT_FONT_SIZES, ...(parsed.fontSizes || {}) },
              site: {
                ...DEFAULT_DATA.site,
                ...ps,
                defaultDiscountRate: ps.defaultDiscountRate !== undefined

                promoBannerText: ps.promoBannerText !== undefined
                  ? ps.promoBannerText

                helpCustomerItems: Array.isArray(ps.helpCustomerItems)
                  ? ps.helpCustomerItems
                  : DEFAULT_DATA.site.helpCustomerItems,
                helpStudioItems: Array.isArray(ps.helpStudioItems)
                  ? ps.helpStudioItems

              studios: Array.isArray(parsed.studios) ? parsed.studios : DEFAULT_DATA.studios,
              savedIds: Array.isArray(parsed.savedIds) ? parsed.savedIds : DEFAULT_DATA.savedIds,
              inquiries: Array.isArray(parsed.inquiries) ? parsed.inquiries : []
            };

        } catch (e) {}
        return JSON.parse(JSON.stringify(DEFAULT_DATA));

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function syncHash(target) {
        lastHandledHash = target;
        if (window.location.hash !== target) {
          window.location.hash = target;
        }
      }

      function applyHashRoute() {
        pendingAdminPrompt = false;
        const raw = (window.location.hash || '').replace(/^#/, '');
        if (!raw) {
          viewMode = 'front';
          frontTab = 'home';
          currentStudioId = null;
          return;
        }
        if (raw === 'admin') {
          if (isAdminAuthed) {
            viewMode = 'admin';
            editingStudioId = null;
            currentStudioId = null;
          } else {
            viewMode = 'front';
            frontTab = 'home';
            currentStudioId = null;
            pendingAdminPrompt = true;
          }
          return;
        }
        const parts = raw.split('/');
        const tab = parts[0];
        let studioId = null;
        if (parts[1]) {
          try {
            studioId = decodeURIComponent(parts[1]);
          } catch (e) {
            studioId = null;
          }
        }
        if (['home', 'explore', 'saved', 'profile'].includes(tab)) {
          viewMode = 'front';
          frontTab = tab;
          currentStudioId = studioId && state.studios.some(s => s.id === studioId) ? studioId : null;
        } else {
          viewMode = 'front';
          frontTab = 'home';
          currentStudioId = null;
        }
      }

      function applyFontSettings() {
        const rootStyle = document.documentElement.style;
        const scale = Number(state.fontScale) || 1;
        rootStyle.setProperty('--font-scale', String(scale));

        Object.values(FONT_CONFIG_MAP).forEach((cfg) => {
          const val = state.fontSizes && state.fontSizes[cfg.key] ? Number(state.fontSizes[cfg.key]) : DEFAULT_FONT_SIZES[cfg.key];
          rootStyle.setProperty(cfg.cssVar, val + 'px');
        });

        document.querySelectorAll('[data-font-scale-select]').forEach((sel) => {
          sel.value = String(scale);
        });
      }

      function fontSelectHTML(extraId) {
        const cur = Number(state.fontScale) || 1;
        const opts = [
          { v: '0.9', t: '字體：較小' },
          { v: '1', t: '字體：標準' },
          { v: '1.15', t: '字體：偏大' },
          { v: '1.3', t: '字體：特大' }
        ];
        return `
          <select class="font-select" ${extraId ? `id="${extraId}"` : ''} data-font-scale-select title="調整整體閱讀字體大小" aria-label="調整字體大小">
            ${opts.map((o) => `<option value="${o.v}" ${String(cur) === o.v ? 'selected' : ''}>${o.t}</option>`).join('')}
          </select>
        `;
      }

      function getDiscountOption(rate) {
        const num = Number(rate);
        return DISCOUNT_OPTIONS.find(o => Math.abs(o.rate - num) < 0.001) || DISCOUNT_OPTIONS[2];
      }

      function getStudioDiscountRate(studio) {
        if (studio && studio.discountRate !== undefined && studio.discountRate !== null && studio.discountRate !== 'default' && studio.discountRate !== '') {
          return Number(studio.discountRate);
        }
        return state.site.defaultDiscountRate !== undefined ? Number(state.site.defaultDiscountRate) : 0.9;
      }

      function calcDiscountPrice(priceStr, rate) {
        if (Number(rate) >= 0.999) return null;
        const str = String(priceStr || '').trim();
        const match = str.match(/[\d,]+/);
        if (!match) return null;
        const num = parseInt(match[0].replace(/,/g, ''), 10);
        if (isNaN(num) || num <= 0) return null;
        const discounted = Math.round(num * Number(rate));
        const suffix = str.indexOf('起') !== -1 ? '起' : '';
        return '$' + discounted.toLocaleString() + suffix;
      }

      function getStudioPromoBannerText(studio, rate) {
        if (rate >= 0.999) return '';
        const opt = getDiscountOption(rate);
        const globalRate = state.site.defaultDiscountRate !== undefined ? Number(state.site.defaultDiscountRate) : 0.9;
        const isOverridden = studio.discountRate && studio.discountRate !== 'default' && Math.abs(Number(studio.discountRate) - globalRate) > 0.001;
        if (isOverridden) {
          return `透過「${state.site.brandName}」完成預約並消費，本工作室結帳即享 ${opt.label} 專屬優惠`;
        }
        return state.site.promoBannerText || `透過「${state.site.brandName}」完成預約並消費，結帳即享 ${opt.label} 專屬優惠`;
      }

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');

      function getFilteredStudios() {
        return state.studios.filter((st) => {
          if (filters.city !== '全部' && st.city !== filters.city) return false;

          if (filters.style !== '全部' && st.style !== filters.style) return false;
          if (filters.q.trim()) {
            const kw = filters.q.trim().toLowerCase();
            const hay = `${st.name} ${st.location} ${st.category} ${st.style}`.toLowerCase();
            if (hay.indexOf(kw) === -1) return false;

          return true;

              <p class="body-text" style="font-weight:600; margin-top:6px;">${esc(s.tagline)}</p>
              <p class="body-text" style="color:var(--muted); margin-top:6px;">${esc(s.story)}</p>
              <p class="sub-text" style="color:var(--muted); margin-top:8px;">📍 ${esc(s.address)}<br>🗓️ ${esc(s.bookingInfo)}</p>
            </div>

            <div class="card" style="padding:16px;">
              <div class="service-head-bar">
                <span class="body-text" style="font-weight:700;">服務項目與價格</span>
                <span class="service-action-hint">👇 點擊項目即可詢問預約</span>
              </div>
              ${bannerText
                ? `<div class="service-promo-banner">
                     <span>🎁</span>
                     <span>${esc(bannerText)}</span>
                   </div>`
                : ''
              }
              <div>
                ${(s.services || []).map((srv) => {
                  const dealPrice = calcDiscountPrice(srv.price, rate);
                  return `
                    <div class="service-item-row" data-action="pick-service" data-id="${esc(s.id)}" data-srv="${esc(srv.name)}" data-price="${esc(srv.price)}" data-deal="${esc(dealPrice || '')}" data-rate-label="${esc(discOpt.short)}">
                      <div>
                        <div class="body-text" style="font-weight:600;">${esc(srv.name)}</div>
                        <div class="sub-text" style="color:var(--muted);">${esc(srv.duration)}</div>
                      </div>
                      <div class="service-price-col">
                        ${rate >= 0.999
                          ? `<div class="price-deal-row">
                               <strong class="price-regular">${esc(srv.price)}</strong>
                               <span style="color:var(--muted);">→</span>
                             </div>`
                          : dealPrice
                            ? `<span class="price-orig">原價 ${esc(srv.price)}</span>
                               <div class="price-deal-row">
                                 <span class="promo-tag">${esc(discOpt.short)}</span>
                                 <strong class="price-deal">${esc(dealPrice)}</strong>
                                 <span style="color:var(--muted);">→</span>
                               </div>`
                            : `<div class="price-deal-row">
                                 <span class="promo-tag">${esc(discOpt.short)}</span>
                                 <strong class="price-deal">${esc(srv.price)}</strong>
                                 <span style="color:var(--muted);">→</span>
                               </div>`
                        }
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div id="inquiry-box" class="hidden card" style="border-color:var(--forest);"></div>

            <div class="grid-2">
              <button class="btn btn-forest" data-action="copy-text" data-label="LINE ID" data-val="${esc(s.line)}">複製 LINE ID（${esc(s.line)}）</button>
              <button class="btn btn-ivory" data-action="copy-text" data-label="IG 帳號" data-val="${esc(s.ig)}">複製 IG（${esc(s.ig)}）</button>
            </div>
          </div>
        `;
        document.getElementById('modal-backdrop').classList.remove('hidden');
      }

      function openCertModal() {
        const box = document.getElementById('modal-box');
        box.classList.remove('modal-box-sm');
        box.innerHTML = `
          <div class="modal-head">
            <strong class="section-heading">優質認證，不是買得到的</strong>
            <button class="btn btn-ivory btn-sm" data-action="close-modal">關閉</button>
          </div>
          <div class="modal-body stack">
            <p class="body-text" style="color:var(--muted);">由平台人工審核，與付費完全無關，確保每一位預約者安心：</p>
            <div class="card" style="padding:14px;">
              <p class="body-text" style="margin-bottom:8px;"><strong>1. 作品真實性：</strong>確認皆為工作室本人實際施作實拍，無盜圖。</p>
              <p class="body-text" style="margin-bottom:8px;"><strong>2. 服務資訊透明：</strong>明確列出價格、施作時間與加價標準。</p>
              <p class="body-text" style="margin-bottom:8px;"><strong>3. 服務品質：</strong>評估用料來源、環境衛生與接待體驗。</p>
              <p class="body-text"><strong>4. 可信度與評價：</strong>長期追蹤真實顧客回饋，絕不販售標章。</p>
            </div>
            <button class="btn btn-forest" data-action="cert-apply">立即申請進駐成為創始夥伴</button>
          </div>
        `;
        document.getElementById('modal-backdrop').classList.remove('hidden');
      }

      function closeModal(shouldSyncHash) {
        if (shouldSyncHash === undefined) shouldSyncHash = true;
        document.getElementById('modal-backdrop').classList.add('hidden');
        if (currentStudioId) {
          currentStudioId = null;
          if (shouldSyncHash && viewMode === 'front') {
            syncHash('#' + frontTab);
          }
        } else if (shouldSyncHash && viewMode === 'front' && window.location.hash === '#admin') {
          syncHash('#' + frontTab);
        }
      }

      window.addEventListener('hashchange', () => {
        if (window.location.hash === lastHandledHash) return;
        lastHandledHash = window.location.hash;
        applyHashRoute();
        renderAll();
        if (pendingAdminPrompt) {
          pendingAdminPrompt = false;
          openAdminLoginModal();
        } else if (currentStudioId) {
          openStudioModal(currentStudioId, false);
        } else {
          closeModal(false);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const backdrop = document.getElementById('modal-backdrop');
          if (backdrop && !backdrop.classList.contains('hidden')) {
            closeModal(true);
          }
        }
      });

      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) {
          if (e.target.id === 'modal-backdrop') closeModal(true);
          return;
        }
        const act = el.dataset.action;

        if (act === 'go-tab') {
          viewMode = 'front';
          frontTab = el.dataset.tab;
          currentStudioId = null;
          closeModal(false);
          syncHash('#' + frontTab);
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (act === 'switch-help-role') {
          homeHelpRole = el.dataset.role;
          renderFront();
        } else if (act === 'toggle-admin') {
          if (viewMode === 'admin') {
            viewMode = 'front';
            editingStudioId = null;
            syncHash('#' + frontTab);
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (isAdminAuthed) {
            viewMode = 'admin';
            editingStudioId = null;
            currentStudioId = null;
            syncHash('#admin');
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            openAdminLoginModal();
          }
        } else if (act === 'admin-logout') {
          setSessionAuth(false);
          viewMode = 'front';
          editingStudioId = null;
          syncHash('#' + frontTab);
          renderAll();
          showToast('已登出並鎖定管理後台');
        } else if (act === 'open-studio') {
          openStudioModal(el.dataset.id, true);
        } else if (act === 'open-cert') {
          openCertModal();
        } else if (act === 'close-modal') {
          closeModal(true);
        } else if (act === 'cert-apply') {
          closeModal(false);
          viewMode = 'front';
          frontTab = 'profile';
          syncHash('#profile');
          renderAll();
        } else if (act === 'toggle-save') {
          const id = el.dataset.id;
          if (state.savedIds.indexOf(id) !== -1) state.savedIds = state.savedIds.filter(x => x !== id);
          else state.savedIds.push(id);
          saveState();
          openStudioModal(id, false);
          if (frontTab === 'saved') renderFront();
          showToast(state.savedIds.indexOf(id) !== -1 ? '已加入收藏' : '已取消收藏');
        } else if (act === 'copy-text') {
          const val = el.dataset.val;
          if (navigator.clipboard) navigator.clipboard.writeText(val).catch(() => {});
          showToast(`已複製 ${el.dataset.label}：${val}`);
        } else if (act === 'pick-service') {
          const box = document.getElementById('inquiry-box');
          box.classList.remove('hidden');
          const rateLabel = el.dataset.rateLabel || '';
          const hasDiscount = Boolean(rateLabel);
          const dealTxt = !hasDiscount
            ? esc(el.dataset.price)
            : el.dataset.deal
              ? `原價 ${esc(el.dataset.price)}｜完成預約享 ${esc(rateLabel)} ${esc(el.dataset.deal)}`
              : `${esc(el.dataset.price)}（完成預約享 ${esc(rateLabel)}）`;
          const savedServiceLabel = !hasDiscount
            ? `${el.dataset.srv}（${el.dataset.price}）`
            : `${el.dataset.srv}（完成預約${rateLabel}：${el.dataset.deal || el.dataset.price}）`;
          box.innerHTML = `
            <div class="body-text" style="font-weight:700; color:var(--forest); margin-bottom:8px;">
              預約詢問：${esc(el.dataset.srv)}（${dealTxt}）
            </div>
            <form id="inquiry-form" class="stack" style="margin-top:0;" data-studio-id="${esc(el.dataset.id)}" data-service="${esc(savedServiceLabel)}" data-rate-label="${esc(rateLabel)}">
              <div class="grid-2">
                <input class="input" name="customerName" required placeholder="您的稱呼 *" />
                <input class="input" name="contact" required placeholder="LINE ID 或手機 *" />
              </div>
              <input class="input" name="datePref" placeholder="期望日期或備註（選填）" />
              <button type="submit" class="btn btn-forest btn-sm">送出預約詢問</button>
            </form>
          `;
          box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else if (act === 'reset-filters') {
          filters = { q: '', city: '全部', category: '全部', style: '全部' };
          renderFront();
        } else if (act === 'admin-tab') {
          adminTab = el.dataset.tab;
          editingStudioId = null;
          renderAdmin();
        } else if (act === 'step-fs') {
          const k = el.dataset.key;
          const step = Number(el.dataset.step);
          const min = Number(el.dataset.min);
          const max = Number(el.dataset.max);
          const cur = (state.fontSizes && state.fontSizes[k]) ? Number(state.fontSizes[k]) : DEFAULT_FONT_SIZES[k];
          const nextVal = Math.min(max, Math.max(min, cur + step));
          state.fontSizes[k] = nextVal;
          saveState();
          applyFontSettings();
          const rangeEl = document.getElementById('fs-range-' + k);
          if (rangeEl) rangeEl.value = String(nextVal);
          const valEl = document.getElementById('fs-val-' + k);
          if (valEl) valEl.textContent = nextVal + ' px';
        } else if (act === 'reset-font-sizes') {
          state.fontSizes = { ...DEFAULT_FONT_SIZES };
          saveState();
          applyFontSettings();
          renderAdmin();
          showToast('已恢復各區塊預設字體大小');
        } else if (act === 'admin-new-studio') {
          const newId = 'studio-' + Date.now();
          draftStudio = {
            id: newId, name: '新個人工作室', category: '美甲', city: '台北', location: '台北大安',
            address: '全預約制工作室（預約後提供詳細地址）', style: '法式簡約', minPrice: 1200,
            certified: false, discountRate: 'default',
            tagline: '請輸入一句話介紹...', story: '請輸入品牌故事...',
            coverImage: 'https://images.unsplash.com/photo-1685963086339-85c3b3ecafe9?auto=format&fit=crop&w=900&q=80',
            bookingInfo: '採預約制', ig: '@your.studio', line: '@yourstudio',
            services: [{ name: '基礎預約項目', price: '$1,200', duration: '90 分鐘' }]
          };
          editingStudioId = newId;
          renderAdmin();
        } else if (act === 'admin-edit-studio') {
          const found = state.studios.find(x => x.id === el.dataset.id);
          if (found) {
            draftStudio = JSON.parse(JSON.stringify(found));
            if (draftStudio.discountRate === undefined) draftStudio.discountRate = 'default';
            if (!Array.isArray(draftStudio.services)) draftStudio.services = [];
            editingStudioId = found.id;
            renderAdmin();
          }
        } else if (act === 'admin-cancel-edit') {
          editingStudioId = null; draftStudio = null; renderAdmin();
        } else if (act === 'admin-toggle-cert') {
          state.studios = state.studios.map(s => s.id === el.dataset.id ? { ...s, certified: !s.certified } : s);
          saveState(); renderAdmin(); showToast('已更新認證狀態');
        } else if (act === 'admin-del-studio') {
          if (confirm('確定要刪除這間工作室嗎？')) {
            const delId = el.dataset.id;
            state.studios = state.studios.filter(s => s.id !== delId);
            state.savedIds = state.savedIds.filter(id => id !== delId);
            saveState(); renderAdmin(); showToast('已刪除工作室');
          }
        } else if (act === 'draft-add-service' && draftStudio) {
          if (!Array.isArray(draftStudio.services)) draftStudio.services = [];
          draftStudio.services.push({ name: '新服務項目', price: '$1,000', duration: '60 分鐘' });
          renderAdmin();
        } else if (act === 'draft-del-service' && draftStudio) {
          if (Array.isArray(draftStudio.services)) {
            draftStudio.services.splice(Number(el.dataset.idx), 1);
          }
          renderAdmin();
        } else if (act === 'admin-del-inq') {
          state.inquiries = state.inquiries.filter(i => i.id !== el.dataset.id);
          saveState(); renderAdmin();
        } else if (act === 'export-json') {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `私室選備份_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('已下載備份檔案');
        } else if (act === 'reset-all-data') {
          if (confirm('確定要清除所有自訂資料，恢復為系統預設嗎？')) {
            state = JSON.parse(JSON.stringify(DEFAULT_DATA));
            saveState(); renderAll(); showToast('已恢復預設資料');
          }
        }
      });

      document.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.fsKey) {
          const k = t.dataset.fsKey;
          const val = Number(t.value);
          state.fontSizes[k] = val;
          saveState();
          applyFontSettings();
          const valEl = document.getElementById('fs-val-' + k);
          if (valEl) valEl.textContent = val + ' px';
        }
        if (t.dataset.filter) {
          filters[t.dataset.filter] = t.value;
          if (t.dataset.filter === 'q') renderExploreResults();
        }
        if (draftStudio && t.dataset.draft) {
          draftStudio[t.dataset.draft] = t.dataset.draft === 'minPrice' ? Number(t.value) || 0 : t.value;
        }
        if (draftStudio && t.dataset.srvIdx !== undefined) {
          draftStudio.services[Number(t.dataset.srvIdx)][t.dataset.srvField] = t.value;
        }
      });

      document.addEventListener('change', (e) => {
        const t = e.target;
        if (t.hasAttribute('data-font-scale-select')) {
          state.fontScale = Number(t.value) || 1;
          saveState();
          applyFontSettings();
          showToast('已調整整體字體大小');
          return;
        }
        if (t.id === 'global-discount-select') {
          const rate = Number(t.value);
          const opt = getDiscountOption(rate);
          const promoInp = document.getElementById('global-promo-input');
          if (promoInp && rate < 0.999) {
            if (/[\d.]+\s*折/.test(promoInp.value)) {
              promoInp.value = promoInp.value.replace(/[\d.]+\s*折/, opt.label);
            } else if (!promoInp.value.trim()) {
              promoInp.value = `透過「${state.site.brandName}」完成預約並消費，結帳即享 ${opt.label} 專屬優惠`;
            }
          }
          return;
        }
        if (t.dataset.filter && t.dataset.filter !== 'q') {
          filters[t.dataset.filter] = t.value;
          renderExploreResults();
        }
        if (draftStudio && t.dataset.draft) {
          draftStudio[t.dataset.draft] = t.dataset.draft === 'minPrice' ? Number(t.value) || 0 : t.value;
        }
        if (draftStudio && t.dataset.draftCheck) {
          draftStudio[t.dataset.draftCheck] = t.checked;
        }
        if (t.dataset.inqStatus) {
          state.inquiries = state.inquiries.map(i => i.id === t.dataset.inqStatus ? { ...i, status: t.value } : i);
          saveState(); showToast('已更新詢問狀態');
        }
        if (t.id === 'import-json-input' && t.files && t.files[0]) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (parsed.site && Array.isArray(parsed.studios)) {
                state = {
                  ...DEFAULT_DATA,
                  ...parsed,
                  fontSizes: { ...DEFAULT_FONT_SIZES, ...(parsed.fontSizes || {}) },
                  site: { ...DEFAULT_DATA.site, ...(parsed.site || {}) }
                };
                saveState(); renderAll(); showToast('匯入還原成功！');
              } else alert('備份檔格式不正確');
            } catch (err) { alert('讀取檔案失敗'); }
            t.value = '';
          };
          reader.readAsText(t.files[0]);
        }
      });

      document.addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;

        if (form.id === 'admin-login-form') {
          const pw = new FormData(form).get('password');
          if (pw === (state.adminPassword || '1234')) {
            setSessionAuth(true);
            closeModal(false);
            viewMode = 'admin';
            editingStudioId = null;
            syncHash('#admin');
            renderAll();
            showToast('驗證成功，歡迎進入管理後台');
          } else {
            const err = document.getElementById('admin-pw-error');
            if (err) err.classList.remove('hidden');
          }
        } else if (form.id === 'change-pw-form') {
          const newPw = String(new FormData(form).get('newPassword') || '').trim();
          if (!newPw) return;
          state.adminPassword = newPw;
          saveState();
          form.reset();
          showToast('已更新管理後台密碼！');
        } else if (form.id === 'studio-edit-form' && draftStudio) {
          const idx = state.studios.findIndex(x => x.id === draftStudio.id);
          if (idx >= 0) state.studios[idx] = draftStudio;
          else state.studios.unshift(draftStudio);
          saveState();
          editingStudioId = null; draftStudio = null;
          renderAdmin();
          showToast('已儲存工作室資料！');
        } else if (form.id === 'site-edit-form') {
          const fd = new FormData(form);
          const simpleKeys = [
            'brandName', 'brandSub', 'promoBannerText', 'heroLine1', 'heroLine2', 'heroBadge',
            'heroImg1', 'heroImg2', 'heroImg3', 'whyTitle', 'whyDesc1', 'whyDesc2',
            'helpSectionTitle', 'helpSectionSub', 'helpCustomerTitle', 'helpCustomerBefore',
            'helpStudioTitle', 'helpStudioBefore', 'quote', 'quoteAuthor'
          ];
          simpleKeys.forEach((k) => {
            if (fd.has(k)) state.site[k] = fd.get(k);
          });
          if (fd.has('defaultDiscountRate')) {
            state.site.defaultDiscountRate = Number(fd.get('defaultDiscountRate'));
          }
          state.site.helpCustomerItems = (state.site.helpCustomerItems || []).map((it, idx) => ({
            title: fd.has('c_title_' + idx) ? fd.get('c_title_' + idx) : it.title,
            desc: fd.has('c_desc_' + idx) ? fd.get('c_desc_' + idx) : it.desc
          }));
          state.site.helpStudioItems = (state.site.helpStudioItems || []).map((it, idx) => ({
            title: fd.has('s_title_' + idx) ? fd.get('s_title_' + idx) : it.title,
            desc: fd.has('s_desc_' + idx) ? fd.get('s_desc_' + idx) : it.desc
          }));
          saveState();
          renderHeader();
          showToast('已儲存首頁文案與優惠設定！');
        } else if (form.id === 'apply-form') {
          const fd = new FormData(form);
          const city = fd.get('city');
          const district = fd.get('district') || '';
          const newStudio = {
            id: 'studio-' + Date.now(),
            name: fd.get('name'),
            category: fd.get('category'),
            city: city,
            location: city + district,
            address: '新進駐審核中（全預約制）',
            style: '法式簡約',
            minPrice: Number(fd.get('minPrice')) || 1200,
            certified: false,
            discountRate: 'default',
            tagline: fd.get('tagline') || '新申請加入之獨立創作者。',
            story: fd.get('tagline') || '歡迎預約體驗。',
            coverImage: 'https://images.unsplash.com/photo-1685963086339-85c3b3ecafe9?auto=format&fit=crop&w=900&q=80',
            bookingInfo: '採預約制',
            ig: fd.get('ig'),
            line: '@studio',
            services: [{ name: '基礎體驗項目', price: '$' + Number(fd.get('minPrice') || 1200).toLocaleString(), duration: '90 分鐘' }]
          };
          state.studios.unshift(newStudio);
          saveState();
          frontTab = 'explore';
          syncHash('#explore');
          renderAll();
          showToast(`已新增「${newStudio.name}」至探索頁！`);
        } else if (form.id === 'inquiry-form') {
          const fd = new FormData(form);
          const st = state.studios.find(x => x.id === form.dataset.studioId);
          const rateLabel = form.dataset.rateLabel || '';
          state.inquiries.unshift({
            id: 'inq-' + Date.now(),
            studioName: st ? st.name : '',
            service: form.dataset.service,
            customerName: fd.get('customerName'),
            contact: fd.get('contact'),
            datePref: fd.get('datePref') || '待確認時段',
            createdAt: new Date().toLocaleDateString('zh-TW'),
            status: '待回覆'
          });
          saveState();
          const confirmMsg = rateLabel
            ? `✓ 已送出預約詢問！待工作室確認檔期並完成預約後，結帳即可享有平台 ${esc(rateLabel)} 優惠（可於「申請 / 紀錄」查看）。`
            : `✓ 已送出預約詢問！待工作室確認檔期後將盡快與您聯繫（可於「申請 / 紀錄」查看）。`;
          document.getElementById('inquiry-box').innerHTML = `<div class="body-text" style="color:var(--forest); font-weight:700; text-align:center;">${confirmMsg}</div>`;
          showToast('預約詢問已送出');
        }
      });

      // 啟動初始化
      lastHandledHash = window.location.hash;
      applyHashRoute();
      renderAll();
      if (pendingAdminPrompt) {
        pendingAdminPrompt = false;
        openAdminLoginModal();
      } else if (currentStudioId) {
        openStudioModal(currentStudioId, false);
      }
    })();
  </script>
</body>
</html>
