<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>私室選｜嚴選獨立工作室指南</title>
  <style>
    :root {
      --linen: #F6F2EA;
      --ivory: #FFFEFA;
      --sand: #EFEAE0;
      --sage: #E6EDE3;
      --peach: #F3E6D8;
      --olive: #EAECE4;
      --ink: #282623;
      --muted: #787166;
      --forest: #224937;
      --hairline: #E6DFD3;
      --gold: #C89E4C;
      --bronze: #9A5B2C;
      --danger: #B91C1C;

      /* 全站閱讀縮放倍率 + 各區塊獨立字體大小 */
      --font-scale: 1;
      --fs-brand: 20px;
      --fs-hero: 28px;
      --fs-hero-badge: 12px;
      --fs-heading: 20px;
      --fs-body: 14px;
      --fs-pill: 12px;
      --fs-sub: 12px;
      --fs-help-card-title: 16px;
      --fs-help-item-title: 15px;
      --fs-help-item-desc: 13px;
      --fs-principle: 13px;
      --fs-quote: 16px;
      --fs-card-title: 15px;
      --fs-card-meta: 12px;
      --fs-btn: 13px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { max-width: 100%; overflow-x: clip; }
    body {
      background: var(--linen);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: calc(var(--fs-body) * var(--font-scale));
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 76px;
    }
    @media (min-width: 768px) { body { padding-bottom: 32px; } }

    a, button, input, select, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    img { display: block; max-width: 100%; }

    /* 頂部導覽列 */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(246, 242, 234, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hairline);
    }
    .topbar-inner {
      max-width: 980px; margin: 0 auto; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-align: left; }
    .brand-logo {
      width: 40px; height: 40px; border-radius: 13px;
      background: var(--forest); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 4px 10px rgba(34, 73, 55, 0.18);
    }
    .brand-title {
      font-size: calc(var(--fs-brand) * var(--font-scale));
      font-weight: 700; letter-spacing: 0.1em; line-height: 1.15;
    }
    .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    @media (max-width: 480px) { .brand-sub { display: none; } }

    .nav-links { display: none; gap: 16px; align-items: center; }
    @media (min-width: 768px) { .nav-links { display: flex; } }
    .nav-btn { font-size: 14px; font-weight: 500; color: var(--muted); padding: 6px 2px; white-space: nowrap; }
    .nav-btn.active { color: var(--forest); font-weight: 700; border-bottom: 2px solid var(--forest); }

    .top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .font-select {
      padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--ivory); border: 1px solid var(--hairline); color: var(--ink);
      cursor: pointer; outline: none;
    }
    .font-select:focus { border-color: var(--forest); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 8px 15px; border-radius: 999px;
      font-size: calc(var(--fs-btn) * var(--font-scale));
      font-weight: 600; transition: opacity 0.15s, transform 0.1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-forest { background: var(--forest); color: #fff; }
    .btn-sage { background: var(--sage); color: var(--forest); }
    .btn-ivory { background: var(--ivory); color: var(--ink); border: 1px solid var(--hairline); }
    .btn-peach { background: var(--peach); color: var(--bronze); }
    .btn-danger { background: #FEE2E2; color: var(--danger); }
    .btn-sm { padding: 6px 11px; font-size: 12px; }

    /* 社群直接連線 + 複製組合按鈕 */
    .social-btn-group {
      display: flex; align-items: stretch; gap: 6px; min-width: 0;
    }
    .social-main-link {
      flex: 1; min-width: 0; text-align: center;
      line-height: 1.35; word-break: break-word;
    }
    .social-copy-btn {
      flex-shrink: 0; padding: 8px 12px;
    }
    .social-preview-bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: var(--linen); border: 1px dashed var(--hairline);
      border-radius: 12px; padding: 10px 12px; font-size: 12px;
    }

    /* 手機底部導覽（5 分頁） */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: rgba(255, 254, 250, 0.96); backdrop-filter: blur(8px);
      border-top: 1px solid var(--hairline);
      display: grid; grid-template-columns: repeat(5, 1fr); height: 62px;
    }
    @media (min-width: 768px) { .bottom-nav { display: none; } }
    .bottom-nav button {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 11px; color: var(--muted); padding: 0 2px; min-width: 0;
    }
    .bottom-nav button span {
      display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bottom-nav button.active { color: var(--forest); font-weight: 700; }

    /* 版面容器 */
    .container { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
    .stack > * + * { margin-top: 20px; }

    /* 各區塊文字類別 */
    .section-heading {
      font-size: calc(var(--fs-heading) * var(--font-scale));
      font-weight: 700; line-height: 1.35;
    }
    .body-text {
      font-size: calc(var(--fs-body) * var(--font-scale));
      line-height: 1.65;
    }
    .sub-text {
      font-size: calc(var(--fs-sub) * var(--font-scale));
      line-height: 1.6;
    }
    .help-card-title-text {
      font-size: calc(var(--fs-help-card-title) * var(--font-scale));
      font-weight: 700; line-height: 1.4;
    }
    .help-item-title-text {
      font-size: calc(var(--fs-help-item-title) * var(--font-scale));
      font-weight: 700; line-height: 1.4;
    }
    .help-item-desc-text {
      font-size: calc(var(--fs-help-item-desc) * var(--font-scale));
      line-height: 1.6;
    }
    .principle-text {
      font-size: calc(var(--fs-principle) * var(--font-scale));
      line-height: 1.6;
    }
    .quote-text {
      font-size: calc(var(--fs-quote) * var(--font-scale));
      font-weight: 700; line-height: 1.5;
    }

    /* 卡片與通用元件 */
    .card {
      background: var(--ivory); border: 1px solid var(--hairline);
      border-radius: 20px; padding: 20px; min-width: 0; max-width: 100%;
      box-shadow: 0 2px 10px rgba(40, 38, 35, 0.03);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px;
      font-size: calc(var(--fs-pill) * var(--font-scale)); font-weight: 600;
    }
    .pill-sage { background: var(--sage); color: var(--forest); }
    .pill-peach { background: var(--peach); color: var(--bronze); }

    .admin-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--sage); color: var(--forest);
    }

    /* 服務項目與平台優惠排版 */
    .service-head-bar {
      display: flex; align-items: center; justify-content: flex-start;
      flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
    }
    .service-action-hint {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 11px; border-radius: 999px;
      background: var(--sage); color: var(--forest);
      border: 1px solid rgba(34, 73, 55, 0.22);
      font-size: calc(var(--fs-sub) * var(--font-scale));
      font-weight: 700; line-height: 1.4;
    }
    .service-promo-banner {
      background: #FAF0E2; border: 1px solid #EAD3B3;
      color: #854B1E; border-radius: 12px;
      padding: 9px 12px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
      font-size: calc(var(--fs-sub) * var(--font-scale));
      font-weight: 600; line-height: 1.45;
    }
    .service-item-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 8px; border-bottom: 1px solid var(--hairline);
      cursor: pointer; transition: background 0.15s; border-radius: 10px;
    }
    .service-item-row:last-child { border-bottom: none; }
    .service-item-row:hover { background: #F7F2E8; }
    .service-price-col {
      text-align: right; flex-shrink: 0;
    }
    .price-orig {
      display: block;
      font-size: calc(11px * var(--font-scale));
      color: #9A9286; text-decoration: line-through; line-height: 1.2;
    }
    .price-deal-row {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    .promo-tag {
      background: var(--peach); color: var(--bronze);
      border: 1px solid #E5C7A6;
      font-size: calc(10px * var(--font-scale));
      font-weight: 700; padding: 1px 6px; border-radius: 6px; line-height: 1.3;
    }
    .price-deal {
      font-size: calc(var(--fs-body) * var(--font-scale));
      font-weight: 700; color: var(--bronze);
    }
    .price-regular {
      font-size: calc(var(--fs-body) * var(--font-scale));
      font-weight: 700; color: var(--forest);
    }

    /* 跨店合作專區樣式 */
    .collab-grid {
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px;
    }
    @media (min-width: 768px) {
      .collab-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .collab-card {
      background: var(--ivory); border: 1px solid var(--hairline);
      border-radius: 20px; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 10px rgba(40, 38, 35, 0.03);
    }
    .collab-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(40,38,35,0.07); }
    .collab-thumb {
      position: relative; aspect-ratio: 16 / 9; background: var(--sand); overflow: hidden;
    }
    .collab-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .collab-tag-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(34, 73, 55, 0.9); color: #fff;
      padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .collab-save-badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255, 254, 250, 0.94); color: var(--bronze);
      border: 1px solid #E5C7A6;
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .collab-body {
      padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1;
    }
    .collab-partners-line {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .collab-includes-preview {
      background: var(--linen); border: 1px solid #EAE2D5;
      border-radius: 12px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .collab-include-bullet {
      display: flex; align-items: flex-start; gap: 6px;
      font-size: calc(var(--fs-sub) * var(--font-scale));
      line-height: 1.45;
    }
    .collab-footer {
      margin-top: auto; padding-top: 10px; border-top: 1px solid #EFE9DF;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .collab-partner-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--sage); color: var(--forest);
      border: 1px solid rgba(34, 73, 55, 0.2);
      font-size: calc(var(--fs-pill) * var(--font-scale));
      font-weight: 700; transition: background 0.15s;
    }
    .collab-partner-chip:hover { background: #D7E3D2; }
    .collab-include-card-row {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 12px; border-radius: 12px;
      background: var(--linen); border: 1px solid var(--hairline);
    }
    .collab-linked-mini {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 12px;
      background: #FAF5EB; border: 1px solid #EAD3B3;
      cursor: pointer; transition: background 0.15s;
    }
    .collab-linked-mini:hover { background: #F5EBD8; }
    .studio-check-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px;
      background: var(--linen); padding: 12px; border-radius: 12px; border: 1px solid var(--hairline);
    }
    .studio-check-item {
      display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; background: var(--ivory); padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--hairline);
    }

    /* 首頁主視覺拼貼 */
    .hero {
      position: relative; border-radius: 22px; overflow: hidden;
      min-height: 240px; border: 1px solid var(--hairline); background: var(--sand);
    }
    @media (min-width: 768px) { .hero { min-height: 290px; } }
    .hero-grid {
      position: absolute; inset: 0; display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px; height: 100%;
    }
    .hero-right {
      display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2px; height: 100%; min-height: 0;
    }
    .hero img { width: 100%; height: 100%; min-height: 0; object-fit: cover; }
    .hero-overlay {
      position: relative; z-index: 2; min-height: 240px;
      background: rgba(35, 32, 28, 0.38);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px 16px; color: #fff;
    }
    @media (min-width: 768px) { .hero-overlay { min-height: 290px; } }
    .hero-overlay h1 {
      font-size: calc(var(--fs-hero) * var(--font-scale));
      font-weight: 700; line-height: 1.4; text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    }
    .hero-badge {
      margin-top: 10px; padding: 5px 14px; border-radius: 999px;
      background: rgba(40, 38, 35, 0.7);
      font-size: calc(var(--fs-hero-badge) * var(--font-scale));
    }

    /* 幫助客戶 & 幫助工作室對照區 */
    .help-toggle-bar {
      display: inline-flex; background: var(--sand); padding: 4px; border-radius: 999px;
      border: 1px solid var(--hairline); margin-top: 10px;
    }
    @media (min-width: 768px) { .help-toggle-bar { display: none; } }
    .help-toggle-btn {
      padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }
    .help-toggle-btn.active { background: var(--forest); color: #fff; }

    .help-card {
      background: var(--ivory); border: 1px solid var(--hairline);
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 2px 10px rgba(40, 38, 35, 0.03);
      display: flex; flex-direction: column;
    }
    @media (max-width: 767px) { .help-card.help-mobile-hidden { display: none; } }
    .help-card-head {
      background: #F4EEE3; padding: 16px 20px; border-bottom: 1px solid var(--hairline);
    }
    .help-card-title {
      display: flex; align-items: center; gap: 8px;
      color: var(--forest); margin-bottom: 4px;
    }
    .help-dot {
      width: 6px; height: 18px; border-radius: 999px; background: var(--forest); display: inline-block; flex-shrink: 0;
    }
    .help-item {
      padding: 14px 20px; border-bottom: 1px solid #EFE9DF;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .help-item:last-child { border-bottom: none; }
    .help-num {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--sage); color: var(--forest);
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; margin-top: 2px;
    }

    /* 網格 */
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

    .grid-3 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    @media (min-width: 768px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    .studio-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (min-width: 768px) { .studio-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }

    /* 工作室卡片 */
    .studio-card {
      background: var(--ivory); border: 1px solid var(--hairline);
      border-radius: 18px; overflow: hidden; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex; flex-direction: column;
    }
    .studio-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(40,38,35,0.06); }
    .studio-thumb { position: relative; aspect-ratio: 4 / 3; background: var(--sand); overflow: hidden; }
    .studio-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .studio-cert-tag {
      position: absolute; top: 8px; left: 8px;
      background: rgba(255, 254, 250, 0.92); color: var(--forest);
      padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .studio-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .studio-name {
      font-size: calc(var(--fs-card-title) * var(--font-scale));
      font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .studio-meta {
      display: flex; justify-content: space-between; align-items: center; margin-top: 4px;
      font-size: calc(var(--fs-card-meta) * var(--font-scale)); gap: 6px;
    }
    .studio-loc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .studio-price { color: var(--forest); font-weight: 700; flex-shrink: 0; }
    .studio-saved-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; flex-wrap: wrap;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #EFE9DF;
      font-size: calc(11px * var(--font-scale));
      color: var(--muted); font-weight: 600;
    }
    .studio-saved-count {
      display: inline-flex; align-items: center; gap: 3px;
    }
    .studio-saved-row.is-saved .studio-saved-count { color: var(--bronze); }
    .studio-comment-btn {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 8px; border-radius: 999px;
      background: var(--linen); color: var(--forest);
      border: 1px solid var(--hairline);
      font-size: calc(11px * var(--font-scale));
      font-weight: 600; line-height: 1.4;
      transition: background 0.15s, border-color 0.15s;
    }
    .studio-comment-btn:hover {
      background: var(--sage);
      border-color: rgba(34, 73, 55, 0.25);
    }

    /* 工作室留言區樣式 */
    #studio-comments-section {
      scroll-margin-top: 68px;
    }
    .comments-list {
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;
    }
    .comment-item {
      background: var(--linen); border: 1px solid #EAE2D5;
      border-radius: 12px; padding: 10px 12px;
    }
    .comment-item-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 4px;
    }
    .comment-author {
      font-size: calc(var(--fs-sub) * var(--font-scale));
      font-weight: 700; color: var(--forest);
    }
    .comment-date {
      font-size: calc(11px * var(--font-scale));
      color: var(--muted);
    }
    .comment-form-box {
      background: #FAF7F0; border: 1px dashed var(--hairline);
      border-radius: 14px; padding: 12px;
    }

    /* 表單與篩選 */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .input, .select, .textarea {
      width: 100%; max-width: 100%; min-width: 0;
      padding: 9px 12px; border-radius: 12px;
      border: 1px solid var(--hairline); background: var(--linen);
      font-size: 14px; outline: none;
    }
    .textarea { resize: none; }
    input[type="date"] { cursor: pointer; min-height: 40px; display: block; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--forest); background: var(--ivory); }
    .filter-bar .select, .filter-bar .input { width: auto; border-radius: 999px; background: var(--ivory); padding: 7px 14px; font-size: 13px; }
    .label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }

    /* 彈窗 Modal */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;

      background: var(--linen); width: 100%; max-width: 680px; max-height: 90vh;

    .modal-head {
      position: sticky; top: 0; background: var(--linen);
      padding: 14px 18px; border-bottom: 1px solid var(--hairline);
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap; z-index: 2;
    }
    .modal-head-actions {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .modal-body { padding: 18px; }

    .admin-banner {
      background: var(--forest); color: #fff;
      padding: 14px 18px; border-radius: 18px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    }
    .admin-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .admin-tab-btn {
      padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: var(--ivory); border: 1px solid var(--hairline); color: var(--muted);
    }
    .admin-tab-btn.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .admin-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px; border-bottom: 1px solid var(--hairline);
    }
    .admin-row:last-child { border-bottom: none; }
    .service-edit-row {
      display: grid; grid-template-columns: 2fr 1fr 2fr auto; gap: 8px; align-items: center;
      background: var(--linen); padding: 10px; border-radius: 12px; border: 1px solid var(--hairline);
      margin-bottom: 8px;
    }
    .collab-inc-edit-row {
      display: grid; grid-template-columns: 1.5fr 3fr auto; gap: 8px; align-items: center;
      background: var(--linen); padding: 10px; border-radius: 12px; border: 1px solid var(--hairline);
      margin-bottom: 8px;
    }
    @media (max-width: 640px) {
      .service-edit-row, .collab-inc-edit-row { grid-template-columns: minmax(0, 1fr); }
    }

    /* 字體設定列（左調右看） */
    .fs-control-card {
      background: var(--linen); border: 1px solid var(--hairline);
      border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .fs-control-top {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    }
    .fs-slider-row {
      display: flex; align-items: center; gap: 10px;
    }
    .fs-range {
      flex: 1; accent-color: var(--forest); cursor: pointer; height: 6px;
    }
    .fs-step-btn {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--ivory); border: 1px solid var(--hairline);

    }
    .fs-step-btn:hover { border-color: var(--forest); color: var(--forest); }
    .fs-tag-badge {
      display: inline-flex; align-items: center; justify-content: center;

      background: var(--forest); color: #fff; margin-right: 4px;
    }
    .preview-pane-label {
      font-size: 11px; font-weight: 700; color: var(--forest);

    }

    .toast {

      function getTodayDateStr() {

        const y = d.getFullYear();

        return `${y}-${m}-${day}`;

      function buildLineUrl(studio) {
        const custom = studio && studio.lineUrl ? String(studio.lineUrl).trim() : '';
        if (custom) {
          return /^https?:\/\//i.test(custom) ? custom : 'https://' + custom;
        }
        const raw = studio && studio.line ? String(studio.line).trim() : '';
        if (!raw) return '';
        if (/^https?:\/\//i.test(raw)) return raw;
        if (/^(line\.me|lin\.ee)\//i.test(raw)) return 'https://' + raw;
        if (raw.startsWith('@')) {
          return 'https://line.me/R/ti/p/' + encodeURIComponent(raw);
        }
        return 'https://line.me/ti/p/~' + encodeURIComponent(raw);
      }

      function buildIgUrl(studio) {
        const custom = studio && studio.igUrl ? String(studio.igUrl).trim() : '';
        if (custom) {
          return /^https?:\/\//i.test(custom) ? custom : 'https://' + custom;
        }
        const raw = studio && studio.ig ? String(studio.ig).trim() : '';
        if (!raw) return '';
        if (/^https?:\/\//i.test(raw)) return raw;
        if (/^(www\.)?instagram\.com\//i.test(raw)) return 'https://' + raw;
        const handle = raw.replace(/^@+/, '');
        if (!handle) return '';
        return 'https://www.instagram.com/' + encodeURIComponent(handle) + '/';
      }

      function formatSocialDisplay(val) {
        const raw = String(val || '').trim();
        if (!raw) return '未提供';
        if (/^https?:\/\//i.test(raw)) {
          return raw.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
        }
        return raw;
      }

      function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (err) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              adminPassword: parsed.adminPassword || DEFAULT_DATA.adminPassword,
              fontScale: Number(parsed.fontScale) || 1,
              fontSizes: { ...DEFAULT_FONT_SIZES, ...(parsed.fontSizes || {}) },
              site: buildSiteState(parsed.site),
              studios: Array.isArray(parsed.studios) ? parsed.studios : DEFAULT_DATA.studios,
              collaborations: Array.isArray(parsed.collaborations) ? parsed.collaborations : DEFAULT_DATA.collaborations,
              savedIds: Array.isArray(parsed.savedIds) ? parsed.savedIds : DEFAULT_DATA.savedIds,
              inquiries: Array.isArray(parsed.inquiries) ? parsed.inquiries : [],
              comments: Array.isArray(parsed.comments) ? parsed.comments : JSON.parse(JSON.stringify(DEFAULT_DATA.comments))
            };
          }

          for (let i = 0; i < LEGACY_KEYS.length; i++) {
            const legacyRaw = localStorage.getItem(LEGACY_KEYS[i]);
            if (!legacyRaw) continue;
            const prev = JSON.parse(legacyRaw);
            const defaultById = {};
            DEFAULT_DATA.studios.forEach(s => { defaultById[s.id] = s; });

            let mergedStudios;
            let mergedSaved;
            if ((LEGACY_KEYS[i] === 'sishixuan_unified_v5' || LEGACY_KEYS[i] === 'sishixuan_unified_v4') && Array.isArray(prev.studios)) {
              const existingIds = new Set();
              mergedStudios = prev.studios.map((st) => {
                existingIds.add(st.id);
                if (st.baseSavedCount === undefined && defaultById[st.id]) {
                  return { ...st, baseSavedCount: defaultById[st.id].baseSavedCount };
                }
                return st;
              });
              DEFAULT_DATA.studios.forEach((ds) => {
                if (!existingIds.has(ds.id)) mergedStudios.push(JSON.parse(JSON.stringify(ds)));
              });
              mergedSaved = Array.isArray(prev.savedIds) ? prev.savedIds : [...DEFAULT_DATA.savedIds];
            } else {
              mergedStudios = JSON.parse(JSON.stringify(DEFAULT_DATA.studios));
              mergedSaved = [...DEFAULT_DATA.savedIds];
            }

            const migrated = {
              adminPassword: prev.adminPassword || DEFAULT_DATA.adminPassword,
              fontScale: Number(prev.fontScale) || 1,
              fontSizes: { ...DEFAULT_FONT_SIZES, ...(prev.fontSizes || {}) },
              site: buildSiteState(prev.site),
              studios: mergedStudios,
              collaborations: Array.isArray(prev.collaborations) ? prev.collaborations : JSON.parse(JSON.stringify(DEFAULT_DATA.collaborations)),
              savedIds: mergedSaved,
              inquiries: Array.isArray(prev.inquiries) ? prev.inquiries : [],
              comments: Array.isArray(prev.comments) ? prev.comments : JSON.parse(JSON.stringify(DEFAULT_DATA.comments))
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        } catch (e) {}
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }

      function applyHashRoute() {
        pendingAdminPrompt = false;
        const raw = (window.location.hash || '').replace(/^#/, '');
        if (!raw) {
          viewMode = 'front';
          frontTab = 'home';
          currentStudioId = null;

        if (raw === 'admin') {

            currentStudioId = null;
            currentCollabId = null;

            viewMode = 'front';
            frontTab = 'home';
            currentStudioId = null;
            currentCollabId = null;
            pendingAdminPrompt = true;
          }
          return;
        }
        const parts = raw.split('/');
        const tab = parts[0];
        let itemId = null;
        if (parts[1]) {
          try {
            itemId = decodeURIComponent(parts[1]);
          } catch (e) {
            itemId = null;
          }
        }
        if (['home', 'explore', 'collab', 'saved', 'profile'].includes(tab)) {
          viewMode = 'front';
          frontTab = tab;
          if (tab === 'collab') {
            currentStudioId = null;
            currentCollabId = itemId && state.collaborations.some(c => c.id === itemId) ? itemId : null;
          } else {
            currentCollabId = null;
            currentStudioId = itemId && state.studios.some(s => s.id === itemId) ? itemId : null;

          frontTab = 'home';
          currentStudioId = null;

      function getDiscountOption(rate) {
        const num = Number(rate);

      }

      function getStudioDiscountRate(studio) {
        if (studio && studio.discountRate !== undefined && studio.discountRate !== null && studio.discountRate !== 'default' && studio.discountRate !== '') {
          return Number(studio.discountRate);
        }
        return state.site.defaultDiscountRate !== undefined ? Number(state.site.defaultDiscountRate) : 0.9;
      }

      function calcDiscountPrice(priceStr, rate) {
        if (Number(rate) >= 0.999) return null;
        const str = String(priceStr || '').trim();
        const match = str.match(/[\d,]+/);
        if (!match) return null;
        const num = parseInt(match[0].replace(/,/g, ''), 10);
        if (isNaN(num) || num <= 0) return null;
        const discounted = Math.round(num * Number(rate));
        const suffix = str.indexOf('起') !== -1 ? '起' : '';
        return '$' + discounted.toLocaleString() + suffix;
      }

      function getStudioPromoBannerText(studio, rate) {
        if (rate >= 0.999) return '';
        const opt = getDiscountOption(rate);
        const globalRate = state.site.defaultDiscountRate !== undefined ? Number(state.site.defaultDiscountRate) : 0.9;
        const isOverridden = studio.discountRate && studio.discountRate !== 'default' && Math.abs(Number(studio.discountRate) - globalRate) > 0.001;
        if (isOverridden) {
          return `透過「${state.site.brandName}」完成預約並消費，本工作室結帳即享 ${opt.label} 專屬優惠`;

        return state.site.promoBannerText || `透過「${state.site.brandName}」完成預約並消費，結帳即享 ${opt.label} 專屬優惠`;
      }

        const iUrl = buildIgUrl(draftStudio);
        if (lineLink && lineEmpty) {
          if (lUrl) {
            lineLink.href = lUrl;
            lineLink.classList.remove('hidden');
            lineEmpty.classList.add('hidden');
          } else {
            lineLink.classList.add('hidden');
            lineEmpty.classList.remove('hidden');
          }
        }
        if (igLink && igEmpty) {
          if (iUrl) {
            igLink.href = iUrl;
            igLink.classList.remove('hidden');
            igEmpty.classList.add('hidden');
          } else {
            igLink.classList.add('hidden');
            igEmpty.classList.remove('hidden');
          }
        }
      }

      document.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.fsKey) {
          const k = t.dataset.fsKey;
          const val = Number(t.value);
          state.fontSizes[k] = val;
          saveState();
          applyFontSettings();
          const valEl = document.getElementById('fs-val-' + k);
          if (valEl) valEl.textContent = val + ' px';
        }
        if (t.dataset.filter) {
          filters[t.dataset.filter] = t.value;
          if (t.dataset.filter === 'q') renderExploreResults();
        }
        if (t.dataset.collabFilter) {
          collabFilters[t.dataset.collabFilter] = t.value;
          if (t.dataset.collabFilter === 'q') renderCollabResults();
        }
        if (draftStudio && t.dataset.draft) {
          draftStudio[t.dataset.draft] = t.dataset.draft === 'minPrice' ? Number(t.value) || 0 : t.value;
          if (['ig', 'line', 'igUrl', 'lineUrl'].includes(t.dataset.draft)) {
            updateAdminSocialPreview();
          }
        }
        if (draftStudio && t.dataset.srvIdx !== undefined) {
          draftStudio.services[Number(t.dataset.srvIdx)][t.dataset.srvField] = t.value;
        }
        if (draftCollab && t.dataset.collabDraft) {
          const k = t.dataset.collabDraft;
          draftCollab[k] = (k === 'origPrice' || k === 'comboPrice') ? Number(t.value) || 0 : t.value;
        }
        if (draftCollab && t.dataset.incIdx !== undefined) {
          draftCollab.includes[Number(t.dataset.incIdx)][t.dataset.incField] = t.value;
        }
      });

      document.addEventListener('change', (e) => {
        const t = e.target;
        if (t.hasAttribute('data-font-scale-select')) {
          state.fontScale = Number(t.value) || 1;
          saveState();
          applyFontSettings();
          showToast('已調整整體字體大小');
          return;
        }
        if (t.id === 'global-discount-select') {
          const rate = Number(t.value);
          const opt = getDiscountOption(rate);
          const promoInp = document.getElementById('global-promo-input');
          if (promoInp && rate < 0.999) {
            if (/[\d.]+\s*折/.test(promoInp.value)) {
              promoInp.value = promoInp.value.replace(/[\d.]+\s*折/, opt.label);
            } else if (!promoInp.value.trim()) {
              promoInp.value = `透過「${state.site.brandName}」完成預約並消費，結帳即享 ${opt.label} 專屬優惠`;
            }
          }
          return;
        }
        if (t.dataset.filter && t.dataset.filter !== 'q') {
          filters[t.dataset.filter] = t.value;
          renderExploreResults();
        }
        if (t.dataset.collabFilter && t.dataset.collabFilter !== 'q') {
          collabFilters[t.dataset.collabFilter] = t.value;
          renderCollabResults();
        }
        if (draftStudio && t.dataset.draft) {
          draftStudio[t.dataset.draft] = t.dataset.draft === 'minPrice' ? Number(t.value) || 0 : t.value;
        }
        if (draftStudio && t.dataset.draftCheck) {
          draftStudio[t.dataset.draftCheck] = t.checked;
        }
        if (draftCollab && t.dataset.collabDraft) {
          const k = t.dataset.collabDraft;
          draftCollab[k] = (k === 'origPrice' || k === 'comboPrice') ? Number(t.value) || 0 : t.value;
        }
        if (draftCollab && t.dataset.collabDraftCheck) {
          draftCollab[t.dataset.collabDraftCheck] = t.checked;
        }
        if (draftCollab && t.dataset.collabStudioId) {
          const sid = t.dataset.collabStudioId;
          const ids = Array.isArray(draftCollab.studioIds) ? draftCollab.studioIds : [];
          if (t.checked && !ids.includes(sid)) {
            ids.push(sid);
            draftCollab.studioIds = ids;
          } else if (!t.checked) {
            draftCollab.studioIds = ids.filter(x => x !== sid);
          } else {
            draftCollab.studioIds = ids;
          }
        }
        if (t.dataset.inqStatus) {
          state.inquiries = state.inquiries.map(i => i.id === t.dataset.inqStatus ? { ...i, status: t.value } : i);
          saveState(); showToast('已更新詢問狀態');
        }
        if (t.id === 'import-json-input' && t.files && t.files[0]) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (parsed.site && Array.isArray(parsed.studios)) {
                state = {
                  ...DEFAULT_DATA,
                  ...parsed,
                  fontSizes: { ...DEFAULT_FONT_SIZES, ...(parsed.fontSizes || {}) },
                  site: { ...DEFAULT_DATA.site, ...(parsed.site || {}) },
                  collaborations: Array.isArray(parsed.collaborations)
                    ? parsed.collaborations
                    : JSON.parse(JSON.stringify(DEFAULT_DATA.collaborations)),
                  comments: Array.isArray(parsed.comments) ? parsed.comments : []
                };
                saveState(); renderAll(); showToast('匯入還原成功！');
              } else alert('備份檔格式不正確');
            } catch (err) { alert('讀取檔案失敗'); }
            t.value = '';
          };
          reader.readAsText(t.files[0]);
        }
      });

      document.addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;

        if (form.id === 'admin-login-form') {
          const pw = new FormData(form).get('password');
          if (pw === (state.adminPassword || '1234')) {
            setSessionAuth(true);
            closeModal(false);
            viewMode = 'admin';
            editingStudioId = null;
            editingCollabId = null;
            syncHash('#admin');
            renderAll();
            showToast('驗證成功，歡迎進入管理後台');
          } else {
            const err = document.getElementById('admin-pw-error');
            if (err) err.classList.remove('hidden');
          }
        } else if (form.id === 'change-pw-form') {
          const newPw = String(new FormData(form).get('newPassword') || '').trim();
          if (!newPw) return;
          state.adminPassword = newPw;
          saveState();
          form.reset();
          showToast('已更新管理後台密碼！');
        } else if (form.id === 'studio-edit-form' && draftStudio) {
          const idx = state.studios.findIndex(x => x.id === draftStudio.id);
          if (idx >= 0) state.studios[idx] = draftStudio;
          else state.studios.unshift(draftStudio);
          saveState();
          editingStudioId = null; draftStudio = null;
          renderAdmin();
          showToast('已儲存工作室資料！');
        } else if (form.id === 'collab-edit-form' && draftCollab) {
          const idx = state.collaborations.findIndex(x => x.id === draftCollab.id);
          if (idx >= 0) state.collaborations[idx] = draftCollab;
          else state.collaborations.unshift(draftCollab);
          saveState();
          editingCollabId = null; draftCollab = null;
          renderAdmin();
          showToast('已儲存跨店合作套餐！');
        } else if (form.id === 'site-edit-form') {
          const fd = new FormData(form);
          const simpleKeys = [
            'brandName', 'brandSub',
            'navHome', 'navExplore', 'navCollab', 'navSaved', 'navProfile',
            'exploreTitle', 'exploreSub', 'collabTitle', 'collabSub',
            'savedTitle', 'savedSub', 'profileBadge', 'profileTitle', 'profileSub', 'inquiriesTitle',
            'promoBannerText', 'heroLine1', 'heroLine2', 'heroBadge',
            'heroImg1', 'heroImg2', 'heroImg3', 'whyTitle', 'whyDesc1', 'whyDesc2',
            'helpSectionTitle', 'helpSectionSub', 'helpCustomerTitle', 'helpCustomerBefore',
            'helpStudioTitle', 'helpStudioBefore', 'quote', 'quoteAuthor'
          ];
          simpleKeys.forEach((k) => {
            if (fd.has(k)) state.site[k] = fd.get(k);
          });
          if (fd.has('defaultDiscountRate')) {
            state.site.defaultDiscountRate = Number(fd.get('defaultDiscountRate'));
          }
          state.site.helpCustomerItems = (state.site.helpCustomerItems || []).map((it, idx) => ({
            title: fd.has('c_title_' + idx) ? fd.get('c_title_' + idx) : it.title,
            desc: fd.has('c_desc_' + idx) ? fd.get('c_desc_' + idx) : it.desc
          }));
          state.site.helpStudioItems = (state.site.helpStudioItems || []).map((it, idx) => ({
            title: fd.has('s_title_' + idx) ? fd.get('s_title_' + idx) : it.title,
            desc: fd.has('s_desc_' + idx) ? fd.get('s_desc_' + idx) : it.desc
          }));
          saveState();
          renderHeader();
          showToast('已儲存全站標題、文案與優惠設定！');
        } else if (form.id === 'apply-form') {
          const fd = new FormData(form);
          const city = fd.get('city');
          const district = fd.get('district') || '';
          const newStudio = {
            id: 'studio-' + Date.now(),
            name: fd.get('name'),
            category: fd.get('category'),
            city: city,
            location: city + district,
            address: '新進駐審核中（全預約制）',
            style: '法式簡約',
            minPrice: Number(fd.get('minPrice')) || 1200,
            baseSavedCount: 0,
            certified: false,
            discountRate: 'default',
            tagline: fd.get('tagline') || '新申請加入之獨立創作者。',
            story: fd.get('tagline') || '歡迎預約體驗。',
            coverImage: 'https://images.unsplash.com/photo-1685963086339-85c3b3ecafe9?auto=format&fit=crop&w=900&q=80',
            bookingInfo: '採預約制',
            ig: String(fd.get('ig') || '').trim(),
            igUrl: '',
            line: String(fd.get('line') || '').trim(),
            lineUrl: '',
            services: [{ name: '基礎體驗項目', price: '$' + Number(fd.get('minPrice') || 1200).toLocaleString(), duration: '90 分鐘' }]
          };
          state.studios.unshift(newStudio);
          saveState();
          filters = { q: '', city: '全部', category: '全部', style: '全部' };
          frontTab = 'explore';
          syncHash('#explore');
          renderAll();
          showToast(`已新增「${newStudio.name}」至探索頁！`);
        } else if (form.id === 'studio-comment-form') {
          const fd = new FormData(form);
          const studioId = form.dataset.studioId;
          const author = String(fd.get('author') || '').trim();
          const text = String(fd.get('text') || '').trim();
          if (!author || !text) return;
          const st = state.studios.find(x => x.id === studioId);
          if (!Array.isArray(state.comments)) state.comments = [];
          state.comments.unshift({
            id: 'cmt-' + Date.now(),
            studioId: studioId,
            studioName: st ? st.name : '',
            author: author,
            text: text,
            createdAt: new Date().toLocaleDateString('zh-TW')
          });
          saveState();
          openStudioModal(studioId, false, true);
          if (frontTab === 'explore') renderExploreResults();
          else if (frontTab === 'saved') renderFront();
          showToast('已發布留言！');
        } else if (form.id === 'inquiry-form') {
          const fd = new FormData(form);
          const st = state.studios.find(x => x.id === form.dataset.studioId);
          const rateLabel = form.dataset.rateLabel || '';
          state.inquiries.unshift({
            id: 'inq-' + Date.now(),
            studioName: st ? st.name : '',
            service: form.dataset.service,
            customerName: fd.get('customerName'),
            contact: fd.get('contact'),
            datePref: fd.get('datePref') || '未指定日期',
            note: String(fd.get('note') || '').trim(),
            createdAt: new Date().toLocaleDateString('zh-TW'),
            status: '待回覆'
          });
          saveState();
          const confirmMsg = rateLabel
            ? `✓ 已送出預約詢問！待工作室確認檔期並完成預約後，結帳即可享有平台 ${esc(rateLabel)} 優惠（可於「${esc(state.site.navProfile)} / 紀錄」查看）。`
            : `✓ 已送出預約詢問！待工作室確認檔期後將盡快與您聯繫（可於「${esc(state.site.navProfile)} / 紀錄」查看）。`;
          document.getElementById('inquiry-box').innerHTML = `<div class="body-text" style="color:var(--forest); font-weight:700; text-align:center;">${confirmMsg}</div>`;
          showToast('預約詢問已送出');
        } else if (form.id === 'collab-inquiry-form') {
          const fd = new FormData(form);
          state.inquiries.unshift({
            id: 'inq-' + Date.now(),
            studioName: '[跨店聯名] ' + (form.dataset.partners || ''),
            service: form.dataset.service || '跨店聯名套餐',
            customerName: fd.get('customerName'),
            contact: fd.get('contact'),
            datePref: fd.get('datePref') || '未指定日期',
            note: String(fd.get('note') || '').trim(),
            createdAt: new Date().toLocaleDateString('zh-TW'),
            status: '待回覆'
          });
          saveState();
          document.getElementById('collab-inquiry-box').innerHTML = `<div class="body-text" style="color:var(--forest); font-weight:700; text-align:center;">✓ 已送出跨店聯名預約詢問！聯合窗口確認檔期後將盡快與您聯繫（可於「${esc(state.site.navProfile)} / 紀錄」查看）。</div>`;
          showToast('聯名套餐詢問已送出');
        }
      });

      // 啟動初始化
      lastHandledHash = window.location.hash;
      applyHashRoute();
      renderAll();
      if (pendingAdminPrompt) {
        pendingAdminPrompt = false;
        openAdminLoginModal();
      } else if (currentCollabId) {
        openCollabModal(currentCollabId, false);
      } else if (currentStudioId) {
        openStudioModal(currentStudioId, false);
      }
    })();
  </script>
</body>
</html>
